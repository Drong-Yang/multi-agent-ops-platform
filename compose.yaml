name: commerce-fusion
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fusion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password in .env}
      POSTGRES_DB: ${POSTGRES_DB:-commerce_fusion}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - fusion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  etcd:
    profiles: [vector]
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes: [fusion_etcd:/etcd]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 30
  minio:
    profiles: [vector]
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-fusionminio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set a private MinIO key in .env}
    command: minio server /minio_data
    volumes: [fusion_minio:/minio_data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
  milvus:
    profiles: [vector]
    image: milvusdb/milvus:v2.4.4
    command: [milvus, run, standalone]
    security_opt: [seccomp:unconfined]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-fusionminio}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?Set a private MinIO key in .env}
    volumes: [fusion_milvus:/var/lib/milvus]
    ports:
      - "127.0.0.1:19531:19530"
      - "127.0.0.1:29091:9091"
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      start_period: 90s
      timeout: 5s
      retries: 30
volumes:
  fusion_pgdata:
  fusion_etcd:
  fusion_minio:
  fusion_milvus:
